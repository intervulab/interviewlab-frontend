name: Code Cleanup & Formatting
on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Auto-fix
        run: npm run lint -- --fix || true # Ignore failure if some errors can't be auto-fixed

      - name: Run Prettier Auto-format
        run: npm run format || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: automated code cleanup'
          title: '🧹 Automated Code Cleanup (Lint & Format)'
          body: |
            This PR was automatically generated by the `auto-cleanup` workflow.
            It contains auto-fixes from ESLint and formatting changes from Prettier.
          branch: 'auto/code-cleanup'
          base: 'main'
          labels: 'cleanup, automated pr'
          reviewers: 'SxBxcoder'
