# InterviewLab Frontend — Local Development Services
version: "3.8"

services:
  # Next.js development server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
